<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>AGUI Manager</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2290%22%20text-anchor%3D%22middle%22%20font-size%3D%2290%22%3E%F0%9F%8E%9B%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E">
    <script type="module" blocking="render" src="./page/theme.js"></script>
    <link rel="stylesheet" href="./page/styles.css">
    <script type="module" src="./page/index.js"></script>
  </head>
  <body>
    <agui-app class="manager-app">
      <agui-sidebar label="Workspace" expand-label="Expand workspace" collapse-label="Collapse workspace">
        <div class="grid gap-6">
          <section class="grid gap-3" aria-labelledby="filters-heading">
            <h2 id="filters-heading" class="text-xs uppercase tracking-widest text-agui-muted">Find a session</h2>
            <agui-filter id="manager-filter" label="Session filters" results-to="MANAGER/matchingIds" pub-to="MANAGER/filters" query-pub-to="MANAGER/query"
              bind="$.rows: MANAGER/records; $.fields: MANAGER/filterFields; $.texts: MANAGER/filterTexts; $.value: MANAGER/filters; $.query: MANAGER/query; $.loading: MANAGER/loading; $.error: MANAGER/discoveryError"></agui-filter>
          </section>
          <section class="grid gap-3" aria-labelledby="bulk-heading">
            <h2 id="bulk-heading" class="text-xs uppercase tracking-widest text-agui-muted">Scope actions</h2>
            <agui-select label="All sessions in this scope" name="operation" pub-to="MANAGER/bulkOperation" bind="$.options: MANAGER/bulkOptions; $.value: MANAGER/bulkOperation; $.disabled: MANAGER/controlsDisabled"></agui-select>
            <p class="text-xs text-agui-muted">Applies to the entire folder, including sessions hidden by filters.</p>
            <agui-toolbar class="bulk" aria-label="Bulk session actions">
              <button type="button" class="agui-button-primary" bind="onclick: MANAGER/bulk; disabled: MANAGER/controlsDisabled"><agui-icon name="check"></agui-icon>Apply to all</button>
            </agui-toolbar>
          </section>
          <agui-panel class="grid gap-2" aria-label="Storage scope">
            <h2 class="text-xs uppercase tracking-widest text-agui-muted">AGUI folder</h2>
            <p class="break-all text-xs text-agui-muted">{{MANAGER/scope}}</p>
            <button type="button" bind="onclick: MANAGER/openSettings"><agui-icon name="settings"></agui-icon>Folder settings</button>
          </agui-panel>
        </div>
      </agui-sidebar>
      <agui-viewport role="main" aria-label="Sessions" tabindex="0">
        <agui-session-manager ctx="MANAGER" class="flex min-h-full min-w-0 flex-col">
          <agui-header floating>
            <h1 class="flex items-center gap-2"><agui-icon name="dashboard"></agui-icon>AGUI Manager</h1>
            <agui-toolbar class="toolbar" aria-label="Manager controls">
              <agui-theme-toggle id="manager-theme" ctx="MANAGER" aria-label="Dark theme" light-label="Day" dark-label="Night"></agui-theme-toggle>
              <button type="button" class="agui-button-icon" aria-label="Refresh" title="Refresh" bind="onclick: MANAGER/refresh; disabled: MANAGER/refreshDisabled"><agui-icon name="refresh"></agui-icon></button>
              <button type="button" class="agui-button-icon" aria-label="Settings" title="Settings" bind="onclick: MANAGER/openSettings"><agui-icon name="settings"></agui-icon></button>
            </agui-toolbar>
          </agui-header>
          <div class="min-w-0 flex-1 p-4 sm:p-6">
            <div class="mb-6 grid gap-2">
              <p class="text-xs uppercase tracking-widest text-agui-muted">Your workspace</p>
              <h2 class="text-2xl font-semibold">Sessions</h2>
              <p class="counts text-sm text-agui-muted" role="status">{{MANAGER/counts}}</p>
            </div>
            <agui-tabs id="session-views" label="Session view" value="table">
              <agui-tab value="table" label="Table">
                <div class="grid gap-4">
                  <agui-table id="manager-table" label="Sessions" selection="single" page-size="15" pub-to="MANAGER/selection"
                    bind="$.rows: MANAGER/records; $.columns: MANAGER/columns; $.texts: MANAGER/tableTexts; $.filteredIds: MANAGER/matchingIds; $.value: MANAGER/selection; $.loading: MANAGER/loading; $.error: MANAGER/discoveryError"></agui-table>
                </div>
              </agui-tab>
              <agui-tab value="cards" label="Cards">
                <agui-state bind="$.status: MANAGER/emptyStatus; $.message: MANAGER/empty"></agui-state>
                <div class="sessions manager-cards" itemize="MANAGER/rows">
                  <template>
                    <agui-session-row pub-to="MANAGER/selection" bind="state: card"></agui-session-row>
                  </template>
                </div>
              </agui-tab>
            </agui-tabs>
          </div>
          <footer class="manager-footer">
            <span role="status">{{MANAGER/connection}}</span>
            <span>{{MANAGER/checkedAt}}</span>
          </footer>
          <agui-message class="notice" close-label="Dismiss message" bind="$.tone: MANAGER/noticeTone; $.message: MANAGER/notice" hidden></agui-message>
          <agui-message class="connection" close-label="Dismiss message" bind="$.tone: MANAGER/connectionTone; $.message: MANAGER/connection" hidden></agui-message>
          <agui-dialog id="manager-settings" label="AGUI folder settings" close-label="Close settings" pub-to="MANAGER/settingsOpen" bind="$.value: MANAGER/settingsOpen">
            <agui-field label="Save path" name="saveFolder" maxlength="4096" placeholder="Default private cache" pub-to="MANAGER/storageFolder" bind="$.value: MANAGER/storageFolder; $.disabled: MANAGER/storageDisabled"></agui-field>
            <p class="break-words text-xs text-agui-muted">{{MANAGER/storageHint}}</p>
            <p class="break-all text-xs text-agui-muted">{{MANAGER/storageContext}}</p>
            <agui-toolbar aria-label="AGUI folder settings">
              <button type="button" class="agui-button-primary" bind="onclick: MANAGER/saveStorage; disabled: MANAGER/storageDisabled"><agui-icon name="save"></agui-icon>Save folder and open</button>
              <button type="button" bind="onclick: MANAGER/resetStorage; disabled: MANAGER/storageDisabled"><agui-icon name="home"></agui-icon>Use default cache</button>
            </agui-toolbar>
          </agui-dialog>
          <agui-dialog id="manager-description" label="Session description" close-label="Close description" pub-to="MANAGER/descriptionOpen" bind="$.value: MANAGER/descriptionOpen">
            <agui-markdown label="Session description" bind="$.value: MANAGER/description; $.texts: MANAGER/descriptionTexts; $.extensions: MANAGER/descriptionExtensions"></agui-markdown>
          </agui-dialog>
        </agui-session-manager>
      </agui-viewport>
      <agui-sidebar id="session-inspector" side="end" label="Selected session" expand-label="Expand session controls" collapse-label="Collapse session controls"
        pub-to="MANAGER/inspectorOpen" bind="$.value: MANAGER/inspectorOpen; hidden: MANAGER/noSelection" hidden>
        <div itemize="MANAGER/selectedRows" item-tag="agui-session-controls"></div>
      </agui-sidebar>
    </agui-app>
  </body>
</html>
