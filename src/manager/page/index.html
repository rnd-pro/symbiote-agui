<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>AGUI Manager</title>
    <link rel="icon" type="image/svg+xml" sizes="any" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20x%3D%2250%22%20y%3D%2290%22%20text-anchor%3D%22middle%22%20font-size%3D%2290%22%3E%F0%9F%8E%9B%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E">
    <script type="module" blocking="render" src="./page/theme.js"></script>
    <link rel="stylesheet" href="./page/styles.css">
    <script type="module" src="./page/index.js"></script>
  </head>
  <body>
    <agui-session-manager ctx="MANAGER" class="block">
      <agui-header floating>
        <div class="min-w-0">
          <h1 class="flex items-center gap-2"><agui-icon name="dashboard"></agui-icon>AGUI Manager</h1>
        </div>
        <agui-toolbar aria-label="Appearance">
          <agui-theme-toggle id="manager-theme" ctx="MANAGER" aria-label="Dark theme" light-label="Switch to light theme" dark-label="Switch to dark theme"></agui-theme-toggle>
        </agui-toolbar>
      </agui-header>
      <agui-dashboard role="main">
        <agui-panel class="grid gap-3" aria-label="Storage scope">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="flex items-center gap-2"><agui-icon name="home"></agui-icon>Storage scope</h2>
            <small class="text-xs text-agui-muted">{{MANAGER/checkedAt}}</small>
          </div>
          <p class="break-all text-sm text-agui-muted">{{MANAGER/scope}}</p>
          <p class="counts text-sm">{{MANAGER/counts}}</p>
        </agui-panel>
        <agui-panel class="grid gap-4">
          <agui-toolbar class="toolbar items-end" aria-label="Session filters">
            <agui-field label="Search sessions" type="search" name="query" placeholder="Name or description..." pub-to="MANAGER/query" bind="$.value: MANAGER/query"></agui-field>
            <agui-select label="Status" name="status" pub-to="MANAGER/statusFilter" bind="$.options: MANAGER/statusOptions; $.value: MANAGER/statusFilter"></agui-select>
            <button type="button" bind="onclick: MANAGER/refresh; disabled: MANAGER/refreshDisabled"><agui-icon name="refresh"></agui-icon>Refresh</button>
          </agui-toolbar>
          <agui-toolbar class="bulk items-end" aria-label="Bulk session actions">
            <agui-select label="All sessions in this scope" name="operation" pub-to="MANAGER/bulkOperation" bind="$.options: MANAGER/bulkOptions; $.value: MANAGER/bulkOperation; $.disabled: MANAGER/controlsDisabled"></agui-select>
            <button type="button" class="agui-button-primary" bind="onclick: MANAGER/bulk; disabled: MANAGER/controlsDisabled"><agui-icon name="check"></agui-icon>Apply to all</button>
          </agui-toolbar>
          <agui-message class="notice" close-label="Dismiss message" bind="$.tone: MANAGER/noticeTone; $.message: MANAGER/notice" hidden></agui-message>
        </agui-panel>
        <section class="grid min-w-0 gap-4" aria-labelledby="sessions-heading">
          <h2 id="sessions-heading" class="text-lg font-semibold">Sessions</h2>
          <agui-state bind="$.status: MANAGER/emptyStatus; $.message: MANAGER/empty"></agui-state>
          <div class="sessions grid gap-4" itemize="MANAGER/rows" item-tag="agui-session-row"></div>
        </section>
      </agui-dashboard>
      <agui-message class="connection" close-label="Dismiss message" bind="$.tone: MANAGER/connectionTone; $.message: MANAGER/connection" hidden></agui-message>
      <dialog ref="description" aria-labelledby="description-heading">
        <h2 id="description-heading" class="text-lg font-semibold">Session description</h2>
        <pre ref="descriptionText" class="my-5"></pre>
        <form method="dialog"><button autofocus><agui-icon name="close"></agui-icon>Close</button></form>
      </dialog>
    </agui-session-manager>
  </body>
</html>
