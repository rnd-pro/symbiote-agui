<sym-context ctx="GALLERY_IMPORT" pub-map="ASSETS/importStage: stage; ASSETS/importNote: note">
  <script type="application/json">
    {
      "stage": "edit",
      "noteOpen": false,
      "note": "",
      "stages": [
        { "value": "edit", "label": "Edit" },
        { "value": "review", "label": "Review" },
        { "value": "done", "label": "Reviewed" }
      ],
      "stepTexts": {
        "current": "Current step",
        "completed": "Completed",
        "pending": "Not reached",
        "invalidItems": "Check the review stages.",
        "invalidValue": "Choose a review stage."
      }
    }
  </script>
  <agui-panel class="grid gap-4">
    <h3>Imported contact review</h3>
    <agui-steps label="Contact review" bind="$.items: GALLERY_IMPORT/stages; $.value: GALLERY_IMPORT/stage; $.texts: GALLERY_IMPORT/stepTexts"></agui-steps>
    <sym-conditional when="GALLERY_IMPORT/stage" is="edit">
        <div class="grid gap-4 sm:grid-cols-2">
          <agui-field label="Shared name" pub-to="APP/sharedName" bind="$.value: APP/sharedName"></agui-field>
          <agui-select label="Shared status" pub-to="APP/sharedStatus" bind="$.value: APP/sharedStatus; $.options: CONTACT/statusOptions"></agui-select>
        </div>
        <agui-toggle label="Notifications" pub-to="APP/notifications" bind="$.value: APP/notifications"></agui-toggle>
        <sym-conditional when="GALLERY_IMPORT/noteOpen"><agui-field label="Review note" type="textarea" rows="3" pub-to="GALLERY_IMPORT/note" bind="$.value: GALLERY_IMPORT/note"></agui-field></sym-conditional>
        <agui-toolbar aria-label="Contact editing actions">
          <button type="button"  bind="onclick: [toggle]GALLERY_IMPORT/noteOpen"><agui-icon name="comment"></agui-icon>Toggle note</button>
          <button type="button"  value="review" bind="onclick: [set]GALLERY_IMPORT/stage">Review<agui-icon name="arrow_forward"></agui-icon></button>
        </agui-toolbar>
      </sym-conditional>
    <sym-conditional when="GALLERY_IMPORT/stage" is="review">
        <dl class="grid gap-4 sm:grid-cols-2">
          <div><dt class="text-xs text-agui-muted">Name</dt><dd>{{APP/sharedName}}</dd></div>
          <div><dt class="text-xs text-agui-muted">Status</dt><dd>{{APP/sharedStatus}}</dd></div>
          <div><dt class="text-xs text-agui-muted">Notifications</dt><dd>
            <sym-conditional when="APP/notifications" is="true">Enabled</sym-conditional>
            <sym-conditional when="APP/notifications" is="false">Disabled</sym-conditional>
          </dd></div>
        </dl>
        <sym-conditional when="GALLERY_IMPORT/note"><agui-field label="Review note" type="textarea" rows="3" readonly bind="$.value: GALLERY_IMPORT/note"></agui-field></sym-conditional>
        <agui-toolbar aria-label="Contact review actions">
          <button type="button"  value="edit" bind="onclick: [set]GALLERY_IMPORT/stage"><agui-icon name="arrow_back"></agui-icon>Back</button>
          <button type="button"  value="done" bind="onclick: [set]GALLERY_IMPORT/stage"><agui-icon name="check"></agui-icon>Mark reviewed</button>
        </agui-toolbar>
      </sym-conditional>
    <sym-conditional when="GALLERY_IMPORT/stage" is="done">
        <p class="text-agui-accent">Reviewed: {{APP/sharedName}}</p>
        <agui-toolbar aria-label="Review follow-up"><button type="button"  value="edit" bind="onclick: [set]GALLERY_IMPORT/stage"><agui-icon name="edit"></agui-icon>Edit again</button></agui-toolbar>
      </sym-conditional>
    <p class="text-sm text-agui-muted">Shared fields use gallery Save. Notes and the review stage reset on reload.</p>
  </agui-panel>
</sym-context>
