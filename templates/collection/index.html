<sym-context ctx="APP">
  <script type="application/json">{}</script>
  <sym-context ctx="UI">
    <script type="application/json">
      {
        "sectionIcon": "", "sectionLoading": false, "sectionError": "",
        "matchingIds": [], "sort": null, "selectedCount": 0, "emptySelection": [], "detailsOpen": false,
        "selectionOptions": [{ "value": "single", "label": "Single" }, { "value": "multiple", "label": "Multiple" }]
      }
    </script>
  </sym-context>
  <sym-context ctx="DATA"><script type="application/json">{}</script></sym-context>
  <sym-router ctx="ROUTER"><script type="application/json">{}</script></sym-router>
  <link rel="stylesheet" href="./_assets/styles.css">
  <agui-app>
    <agui-sidebar expand-label="Expand navigation" collapse-label="Collapse navigation" bind="$.label: APP/title">
      <agui-nav label="Sections" pub-map="UI/sectionIcon: sectionIcon"
        bind="$.routes: ROUTER/routes; $.value: ROUTER/route; onchange: [navigate]ROUTER"></agui-nav>
      <agui-sidebar-block label="Filters">
        <agui-filter pub-to="UI/filters" query-pub-to="UI/query" results-to="UI/matchingIds"
          bind="$.label: APP/filterLabel; $.rows: DATA/records; $.fields: DATA/columns; $.texts: APP/texts; $.value: UI/filters; $.query: UI/query"></agui-filter>
      </agui-sidebar-block>
      <agui-sidebar-block label="Selection">
        <agui-select label="Selection mode" pub-to="UI/selectionMode" action-data="UI/emptySelection"
          bind="$.value: UI/selectionMode; $.options: UI/selectionOptions; onchange: [set]UI/selectedIds"></agui-select>
      </agui-sidebar-block>
    </agui-sidebar>
    <agui-viewport class="flex flex-col" aria-label="Collection">
      <agui-header floating>
        <h1 class="flex items-center gap-2"><agui-icon bind="$.name: UI/sectionIcon; hidden: !UI/sectionIcon"></agui-icon>{{ROUTER/title}}</h1>
        <agui-toolbar aria-label="Appearance">
          <agui-theme-toggle ctx="APP" aria-label="Toggle dark theme" light-label="Day" dark-label="Night"></agui-theme-toggle>
          <agui-theme-selector label="App theme" pub-to="APP/palette"
            bind="$.value: APP/palette; $.texts: APP/paletteTexts"></agui-theme-selector>
        </agui-toolbar>
      </agui-header>
      <div class="min-w-0 flex-1 p-4 sm:p-6">
        <agui-state status="loading" message="Loading section..." bind="hidden: !UI/sectionLoading"></agui-state>
        <agui-state status="error" bind="$.message: UI/sectionError; hidden: !UI/sectionError"></agui-state>
        <sym-import pub-map="UI/sectionLoading: +loading; UI/sectionError: +loadErrorMessage" bind="@src: ROUTER/+src"></sym-import>
      </div>
      <agui-footer bind="hidden: !APP/footer">{{APP/footer}}</agui-footer>
    </agui-viewport>
    <agui-sidebar side="end" expand-label="Expand selection controls" collapse-label="Collapse selection controls"
      bind="$.label: APP/detailsLabel; hidden: !UI/selectedCount">
      <agui-sidebar-block label="Actions">
        <p class="text-sm text-agui-muted">Selected: {{UI/selectedCount}}</p>
        <agui-toolbar aria-label="Selection actions">
          <agui-button value="true" bind="onclick: [set]UI/detailsOpen">View details</agui-button>
          <agui-button action-data="UI/emptySelection" bind="onclick: [set]UI/selectedIds">Clear selection</agui-button>
        </agui-toolbar>
      </agui-sidebar-block>
    </agui-sidebar>
  </agui-app>
</sym-context>
