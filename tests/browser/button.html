<sym-context id="button-data" ctx="UI">
  <script type="application/json">{"loading":false,"busy":false,"title":"Initial title","open":false}</script>
  <agui-button id="loading-button" class="agui-button-primary" data-extra="initial" aria-label="Refresh"
    bind="$.loading: UI/loading; @disabled: UI/busy; @title: UI/title">
    <agui-icon name="refresh"></agui-icon><span>Refresh</span>
  </agui-button>
  <agui-button id="loading-attribute" loading>Loading</agui-button>
  <agui-button id="read-only" readonly>Read only</agui-button>
  <agui-button id="aria-disabled" aria-disabled="true">Unavailable</agui-button>
  <fieldset disabled><agui-button id="fieldset-disabled">Disabled fieldset</agui-button></fieldset>
  <button id="native-toggle" type="button" bind="onclick: [toggle]UI/open">Toggle</button>
  <sym-conditional when="UI/open"><output>Opened</output></sym-conditional>
  <form id="native-form"><input name="record" value="sample"></form>
  <agui-button id="submit" type="submit" form="native-form" name="action" value="save">Submit</agui-button>
  <agui-button id="native-popover" popovertarget="button-popover">Popover</agui-button>
  <div id="button-popover" popover>Native popover content</div>
</sym-context>
