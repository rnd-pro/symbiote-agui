<context-provider ctx="APP" persist="name email">
  <script type="application/json">{"name":"","email":""}</script>
  <agui-dashboard>
    <form id="editor">
      <agui-field id="name" label="Name" name="name" required pub-to="APP/name" bind="$.value: APP/name"></agui-field>
      <agui-field id="email" label="Email" name="email" type="email" pub-to="APP/email" bind="$.value: APP/email"></agui-field>
    </form>
    <agui-data-toolbar id="data" form="editor"></agui-data-toolbar>
  </agui-dashboard>
</context-provider>
